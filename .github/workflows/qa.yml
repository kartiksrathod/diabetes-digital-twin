name: GlycoTwin Automated QA & Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa_regression:
    name: Unit, Adapter & Browser Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dashboard.txt
          pip install pytest pytest-cov httpx

      - name: Check formatting and whitespace
        run: |
          git diff --check HEAD~1 2>/dev/null || git diff --check

      - name: Generate lightweight test fixtures
        run: |
          python tests/create_test_fixtures.py

      - name: Run Python regression suite with coverage
        run: |
          python -m pytest --cov=. --cov-report=term-missing -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: |
          npm ci || npm install

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run Playwright browser regression suite
        run: |
          npx playwright test --workers=1 --reporter=list
